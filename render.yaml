# Render Blueprint — lets you deploy the backend with "New +" -> "Blueprint" pointed at this
# repo, instead of configuring the service by hand. Secrets are marked sync: false so Render
# prompts for them at setup rather than reading (nonexistent) values from this committed file.
services:
  - type: web
    name: visualmind-ai-backend
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: GROQ_API_KEY
        sync: false
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_ORIGIN
        sync: false

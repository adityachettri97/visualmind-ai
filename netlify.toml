[build]
  command = "npm run build"
  publish = "dist"

  # Keep API requests first-party so browsers do not block the session cookie as third-party.
  [[redirects]]
    from = "/api/*"
    to = "https://visualmind-ai-backend.onrender.com/api/:splat"
    status = 200
    force = true

# Single-page app — every path serves index.html so client-side navigation doesn't 404 on refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
